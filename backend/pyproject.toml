[project]
name = "xport-backend"
version = "0.1.0"
description = "XPort: Multi-Objective Portfolio Optimization Framework - Backend API"
authors = [{ name = "XPort Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "sqlalchemy>=2.0.25,<3.0.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1,<2.0.0",
    "celery>=5.3.6,<6.0.0",
    "redis>=5.0.1,<6.0.0",
    "yfinance>=0.2.36",
    "pandas>=2.0.0",
    "httpx>=0.26.0,<1.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
